project:
    title: Nuxt Base
    description: Nuxt Layer that handles all basic configuration

layer: application

language: typescript

toolchains:
    default: node

workspace:
    inheritedTasks:
        include:
            - pnpm
            - nuxt
            - build
            - portless
            - lint

tasks:
    pnpm:
        args:
            - --filter
            - "@finance-tracker/packages-nuxt-base"
