project:
    title: Tauri Client
    description: (Native) Client using Tauri

layer: application

language: typescript

toolchains:
    default: node

workspace:
    inheritedTasks:
        include:
            - pnpm
            - nuxt
            - build
            - lint

tasks:
    pnpm:
        args:
            - --filter
            - "@finance-tracker/apps-client"

    tauri:
        command: pnpm
        args:
            - exec
            - tauri
        options:
            cache: false
            persistent: true
            runFromWorkspaceRoot: false

    diesel:
        command: diesel
        options:
            cache: false
            interactive: true
            runFromWorkspaceRoot: false
        env:
            DATABASE_URL: "database.db"
