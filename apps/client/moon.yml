project:
    title: Tauri Client
    description: (Native) Client using Tauri

layer: application

language: typescript

toolchains:
    default: node

workspace:
    inheritedTasks:
        include:
            - pnpm
            - nuxt
            - build
            - portless
            - lint

tasks:
    pnpm:
        args:
            - --filter
            - "@finance-tracker/apps-client"

    tauri:
        command: pnpm
        args:
            - exec
            - tauri
        options:
            cache: false
            persistent: true
            runFromWorkspaceRoot: false

    cargo:
        command: scripts/cargo.sh
        options:
            cache: false
            runFromWorkspaceRoot: false
